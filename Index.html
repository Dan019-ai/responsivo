<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsiva</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <nav class="menu"> 
        <ul>
            <li> <a href="#">Inicio</a></li>
            <li> <a href="#">Galeria</a></li>
            <li> <a href="#">Servicios</a></li>
            <li> <a href="#">Contactos</a></li>
        </ul>
    </nav>
    
    <section>
        <h2>Galeria</h2>
        <div class="galeria">
            <div class="tarjeta">
                <img src="./Imagenes/img1.jpeg" alt="lago">
                <h3>Tarjeta</h3>
                <p>Imagen de un lago</p>
            </div>

            <div class="tarjeta">
                <img src="./Imagenes/img2.jpeg" alt="imagen de una ciudad">
                <h3>Tarjeta</h3>
                <p>Foto de una ciudad Italiana</p>
            </div>

            <div class="tarjeta">
                <img src="./Imagenes/img3.jpeg" alt="bosque">
                <h3>Tarjeta</h3>
                <p>Imagen de un bosque espeso</p>
            </div>
        </div>
    </section>
    <section>
        <h2>Contacto</h2>
        <form class="formulario">
            <input type="texto" placeholder="Ingrese su nombre">
            <input type="email" placeholder="Ingrese su email">
            <textarea placeholder="Escriba un mensaje"></textarea>
            <button> Enviar</button>

        </form>
    </section>
</body>
</html>
